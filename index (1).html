<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>🌻 Un lugar para ti</title>

<style>

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000008;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* -------------------------------
   TÍTULO
-------------------------------- */

#titulo {
    position: fixed;
    top: 18px;
    width: 100%;
    text-align: center;

    color: #ffe44d;
    font-size: 23px;
    font-weight: bold;

    text-shadow:
        0 0 8px #ffcc33,
        0 0 20px #ff9900;

    pointer-events: none;
    z-index: 10;
}

/* -------------------------------
   MENSAJE
-------------------------------- */

#mensaje {
    position: fixed;

    left: 50%;
    bottom: 105px;

    transform: translateX(-50%);

    width: 85%;
    max-width: 600px;

    text-align: center;

    color: white;

    font-size: 21px;
    line-height: 1.5;

    text-shadow:
        0 0 8px #000,
        0 0 15px #000;

    opacity: 1;

    transition:
        opacity 1s ease,
        transform 1s ease;

    z-index: 10;

    pointer-events: none;
}

/* -------------------------------
   BOTÓN
-------------------------------- */

#boton {

    position: fixed;

    left: 50%;
    bottom: 35px;

    transform: translateX(-50%);

    border: none;

    padding: 13px 22px;

    border-radius: 30px;

    background: rgba(255, 196, 35, 0.9);

    color: #432600;

    font-size: 16px;
    font-weight: bold;

    box-shadow:
        0 0 15px rgba(255,190,30,0.7);

    cursor: pointer;

    z-index: 20;
}

#boton:active {
    transform:
        translateX(-50%)
        scale(0.95);
}

/* -------------------------------
   IMÁGENES
-------------------------------- */

.foto {

    position: fixed;

    width: 85px;
    height: 85px;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid rgba(255,215,80,0.8);

    box-shadow:
        0 0 20px rgba(255,190,40,0.7);

    opacity: 0.75;

    z-index: 5;

    animation: flotar 5s ease-in-out infinite;
}

.foto1 {
    left: 20px;
    bottom: 170px;
}

.foto2 {
    right: 20px;
    top: 110px;
    animation-delay: 2s;
}

@keyframes flotar {

    0%, 100% {
        transform: translateY(0px);
    }

    50% {
        transform: translateY(-15px);
    }
}

/* -------------------------------
   FIRMA
-------------------------------- */

#firma {

    position: fixed;

    bottom: 8px;

    width: 100%;

    text-align: center;

    color: rgba(255,255,255,0.55);

    font-size: 11px;

    z-index: 10;

    pointer-events: none;
}

</style>
</head>

<body>

<div id="titulo">
    🌻 UN LUGAR PARA TI 🌌
</div>

<img
class="foto foto1"
src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=300&q=80"
alt="Flor amarilla">

<img
class="foto foto2"
src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=300&q=80"
alt="Flores">

<div id="mensaje">
    No tienes que tenerlo todo resuelto hoy. 🌻
</div>

<button id="boton">
    💛 Necesito un poco de ánimo
</button>

<div id="firma">
    A veces, seguir aquí ya es un acto de valentía. 🌻
</div>


<script type="importmap">
{
    "imports": {
        "three":
        "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
}
from "three/addons/controls/OrbitControls.js";


// ==========================================
// ESCENA
// ==========================================

const escena =
    new THREE.Scene();

escena.background =
    new THREE.Color(0x000008);


// ==========================================
// CÁMARA
// ==========================================

const camara =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        2000
    );

camara.position.set(
    0,
    35,
    90
);


// ==========================================
// RENDER
// ==========================================

const renderizador =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderizador.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderizador.setSize(
    window.innerWidth,
    window.innerHeight
);

document.body.appendChild(
    renderizador.domElement
);


// ==========================================
// CONTROLES
// ==========================================

const controles =
    new OrbitControls(
        camara,
        renderizador.domElement
    );

controles.enableDamping = true;

controles.dampingFactor = 0.04;

controles.autoRotate = true;

controles.autoRotateSpeed = 0.25;


// ==========================================
// LUCES
// ==========================================

const luz =
    new THREE.PointLight(
        0xffcc33,
        80,
        250
    );

luz.position.set(
    0,
    0,
    0
);

escena.add(luz);


const luzAmbiente =
    new THREE.AmbientLight(
        0x332200,
        1.5
    );

escena.add(
    luzAmbiente
);


// ==========================================
// CENTRO DE LA GALAXIA
// ==========================================

const centro =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            5,
            32,
            32
        ),

        new THREE.MeshBasicMaterial({
            color: 0xffdd55
        })
    );

escena.add(centro);


// ==========================================
// HALO
// ==========================================

const halo =
    new THREE.Mesh(

        new THREE.SphereGeometry(
            9,
            32,
            32
        ),

        new THREE.MeshBasicMaterial({

            color: 0xff9900,

            transparent: true,

            opacity: 0.12,

            blending:
                THREE.AdditiveBlending
        })
    );

escena.add(halo);


// ==========================================
// ESTRELLAS
// ==========================================

const estrellasGeometria =
    new THREE.BufferGeometry();

const estrellasCantidad =
    5000;

const posiciones =
    new Float32Array(
        estrellasCantidad * 3
    );


for (
    let i = 0;
    i < estrellasCantidad;
    i++
) {

    const radio =
        300 +
        Math.random() * 700;

    const theta =
        Math.random() *
        Math.PI * 2;

    const phi =
        Math.acos(
            2 * Math.random() - 1
        );

    posiciones[i * 3] =
        radio *
        Math.sin(phi) *
        Math.cos(theta);

    posiciones[i * 3 + 1] =
        radio *
        Math.cos(phi);

    posiciones[i * 3 + 2] =
        radio *
        Math.sin(phi) *
        Math.sin(theta);
}


estrellasGeometria.setAttribute(

    "position",

    new THREE.BufferAttribute(
        posiciones,
        3
    )
);


const estrellasMaterial =
    new THREE.PointsMaterial({

        color: 0xffffff,

        size: 0.8,

        transparent: true,

        opacity: 0.8
    });


const estrellas =
    new THREE.Points(

        estrellasGeometria,

        estrellasMaterial
    );

escena.add(estrellas);


// ==========================================
// GALAXIA
// ==========================================

const galaxia =
    new THREE.Group();

escena.add(
    galaxia
);


// ==========================================
// CREAR FLORES
// ==========================================

function crearFlor(tamaño) {

    const grupo =
        new THREE.Group();


    // PÉTALOS

    for (
        let p = 0;
        p < 8;
        p++
    ) {

        const angulo =
            (Math.PI * 2 / 8) *
            p;


        const petalo =
            new THREE.Mesh(

                new THREE.SphereGeometry(
                    tamaño * 0.28,
                    8,
                    8
                ),

                new THREE.MeshBasicMaterial({
                    color: 0xffd21f
                })
            );


        petalo.scale.set(
            0.6,
            1.5,
            0.35
        );


        petalo.position.x =
            Math.cos(angulo) *
            tamaño *
            0.35;


        petalo.position.z =
            Math.sin(angulo) *
            tamaño *
            0.35;


        petalo.rotation.y =
            -angulo;


        grupo.add(
            petalo
        );
    }


    // CENTRO

    const centroFlor =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                tamaño * 0.18,
                8,
                8
            ),

            new THREE.MeshBasicMaterial({
                color: 0x8b4a00
            })
        );


    grupo.add(
        centroFlor
    );


    return grupo;
}


// ==========================================
// FLORES DE LA GALAXIA
// ==========================================

const cantidadFlores =
    2200;


for (
    let i = 0;
    i < cantidadFlores;
    i++
) {

    const brazo =
        i % 5;


    const radio =
        8 +
        Math.random() * 90;


    const espiral =
        radio * 0.075;


    const angulo =
        espiral +

        brazo *
        (Math.PI * 2 / 5) +

        (Math.random() - 0.5)
        * 0.45;


    const x =
        Math.cos(angulo) *
        radio;


    const z =
        Math.sin(angulo) *
        radio;


    const y =
        (Math.random() - 0.5) *
        (3 + radio * 0.04);


    const tamaño =
        0.12 +
        Math.random() *
        0.28;


    const flor =
        crearFlor(
            tamaño
        );


    flor.position.set(
        x,
        y,
        z
    );


    flor.rotation.x =
        Math.random() *
        Math.PI;


    flor.rotation.y =
        Math.random() *
        Math.PI;


    flor.rotation.z =
        Math.random() *
        Math.PI;


    galaxia.add(
        flor
    );
}


// ==========================================
// POLVO
// ==========================================

const polvoGeo =
    new THREE.BufferGeometry();

const polvoCantidad =
    7000;

const polvoPos =
    new Float32Array(
        polvoCantidad * 3
    );


for (
    let i = 0;
    i < polvoCantidad;
    i++
) {

    const radio =
        Math.random() *
        100;

    const angulo =
        Math.random() *
        Math.PI * 2;


    polvoPos[i * 3] =
        Math.cos(angulo) *
        radio;


    polvoPos[i * 3 + 1] =
        (Math.random() - 0.5) *
        2;


    polvoPos[i * 3 + 2] =
        Math.sin(angulo) *
        radio;
}


polvoGeo.setAttribute(

    "position",

    new THREE.BufferAttribute(
        polvoPos,
        3
    )
);


const polvoMat =
    new THREE.PointsMaterial({

        color: 0xffaa22,

        size: 0.12,

        transparent: true,

        opacity: 0.35,

        blending:
            THREE.AdditiveBlending
    });


const polvo =
    new THREE.Points(

        polvoGeo,

        polvoMat
    );


galaxia.add(
    polvo
);


// ==========================================
// MENSAJES
// ==========================================

const mensajes = [

    "🌻 No tienes que tenerlo todo resuelto hoy.",

    "💛 Lo que estás sintiendo ahora no define toda tu historia.",

    "🌱 Está bien ir despacio. También estás avanzando.",

    "✨ Incluso las noches más oscuras terminan dando paso a la luz.",

    "🌻 Tu existencia tiene valor, incluso cuando hoy no puedas sentirlo.",

    "💫 No necesitas ser fuerte todo el tiempo. También puedes descansar.",

    "🌱 Un día difícil no significa que tengas una vida difícil.",

    "💛 Respira. Quédate un momento. No tienes que solucionar todo ahora.",

    "🌻 Hay días para florecer y días para simplemente sobrevivir. Ambos cuentan.",

    "✨ Has llegado hasta aquí. Eso ya dice mucho de ti.",

    "💛 Sé amable contigo. Estás haciendo lo mejor que puedes con lo que tienes.",

    "🌌 Tal vez mañana sea diferente. Date la oportunidad de descubrirlo.",

    "🌻 No estás obligado a tener todas las respuestas hoy.",

    "🌱 Pequeños pasos también pueden llevarte muy lejos.",

    "💫 Tu historia todavía tiene páginas que no has leído.",

    "💛 Descansa si lo necesitas. Descansar no significa rendirse.",

    "🌻 Ojalá puedas recordar que también mereces recibir el cariño que das.",

    "✨ Si hoy solo puedes avanzar un poquito, ese poquito también importa."

];


const elementoMensaje =
    document.getElementById(
        "mensaje"
    );


let indiceMensaje = 0;


function cambiarMensaje() {

    elementoMensaje.style.opacity = 0;

    elementoMensaje.style.transform =
        "translateX(-50%) translateY(10px)";


    setTimeout(() => {

        indiceMensaje++;

        if (
            indiceMensaje >=
            mensajes.length
        ) {
            indiceMensaje = 0;
        }


        elementoMensaje.textContent =
            mensajes[indiceMensaje];


        elementoMensaje.style.opacity = 1;

        elementoMensaje.style.transform =
            "translateX(-50%) translateY(0)";

    }, 700);
}


// Cambiar cada 7 segundos

setInterval(
    cambiarMensaje,
    7000
);


// ==========================================
// BOTÓN DE ÁNIMO
// ==========================================

const boton =
    document.getElementById(
        "boton"
    );


boton.addEventListener(
    "click",
    () => {

        cambiarMensaje();

        // Pequeño efecto de zoom

        camara.position.z =
            82;

        setTimeout(() => {

            camara.position.z =
                90;

        }, 800);
    }
);


// ==========================================
// ANIMACIÓN
// ==========================================

function animar() {

    requestAnimationFrame(
        animar
    );


    const tiempo =
        performance.now() *
        0.0001;


    galaxia.rotation.y =
        tiempo * 0.8;


    centro.rotation.y =
        tiempo * 2;


    halo.scale.setScalar(

        1 +

        Math.sin(
            tiempo * 10
        ) * 0.04

    );


    estrellas.rotation.y =
        tiempo * 0.03;


    controles.update();


    renderizador.render(
        escena,
        camara
    );
}


animar();


// ==========================================
// ADAPTAR A CELULAR
// ==========================================

window.addEventListener(
    "resize",
    () => {

        camara.aspect =
            window.innerWidth /
            window.innerHeight;


        camara.updateProjectionMatrix();


        renderizador.setSize(

            window.innerWidth,

            window.innerHeight

        );
    }
);

</script>

</body>
</html>
